[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4science-lab"
version = "0.1.0"
description = "EV-1.0 deterministic evidence checking and run recording"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
evcheck = "lab.evidence.cli:check"
evcheck-batch = "lab.evidence.cli:batch"

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
"lab.evidence" = ["dev_sources/*.md"]
